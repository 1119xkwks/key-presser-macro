        <dc:title>Full-Size (100%) Keyboard Layout Schematic</dc:title>
        <dc:description>A refactored and optimized schematic diagram of a standard 104-key ANSI full-size (100%) keyboard layout. This version is a derivative work based on the original 'Keyboard_areas.svg' by Daniel Beardsmore.</dc:description>
